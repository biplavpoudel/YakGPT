name: Sync to HuggingFace Hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: [self-hosted, Linux]
    env:
      HF_TOKEN: ${{ secrets.HF }}
      
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-xet
        run: |
          if ! command -v git-xet &> /dev/null; then
            echo "git-xet not found. Installing..."
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/huggingface/xet-core/refs/heads/main/git_xet/install.sh | sh
          else
            echo "git-xet is already installed: $(git-xet --version)"
          fi

      - name: Configure Hugging Face remote
        run: |
          HF_REMOTE_URL="https://hf:$HF_TOKEN@huggingface.co/spaces/build-small-hackathon/YakGPT"

          git remote | grep -q space && \
            git remote set-url space "$HF_REMOTE_URL" || \
            git remote add space "$HF_REMOTE_URL"

      - name: Push to Hub with Xet Storage
        run: |
          git push --force space main